# 放置在 docs/ci/ 供维护者复制到 .github/workflows/build.yml
# 说明见 docs/ci/README.md
name: Build

on:
  push:
    branches:
      - "26.3"
      - "dream-equipment-source-26.3"
      - "dream-equipment-source-26.2"
      - "dream-equipment-source-26.1.2"
      - "main"
      - "arena/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build & Verify (Ubuntu / Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release & metadata consistency
        run: |
          chmod +x scripts/check_release_consistency.sh
          ./scripts/check_release_consistency.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dream-equipment-jars
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
          generate_release_notes: true
